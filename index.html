<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>多次元囲碁世界（仮称）</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

#photoIntro {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('PXL_sora.jpg'); /* ← 見せたい写真に変更 */
    background-size: cover;
    background-position: center;
    z-index: 10000; /* タイトル画面より前に出す */
    opacity: 1;
    transition: opacity 1.5s ease;
}

#photoIntro.hide {
    opacity: 0;
    pointer-events: none;
}
        /* ★ タイトル画面：全画面レイヤー */
#titleScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('space_nasa.jpg');  /* ← NASA 写真を使う */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: center;
}



        #titleScreen .title-inner {
            text-align: center;
            padding: 20px 40px;
            border: 1px solid #888;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0);
        }

        #titleScreen h1 {
            margin-bottom: 16px;
            font-size: 28px;
        }

        #titleScreen p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        #startButton {
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ★ 幕アニメ（回転） */

#titleScreen.hide {
    animation: rotateHide 1.5s ease forwards;
}

@keyframes rotateHide {
    0% {
        transform: rotateY(0deg);
        opacity: 1;
    }
    100% {
        transform: rotateY(90deg);
        opacity: 0;
    }
}
        /* ★ ゲーム画面フェードイン */
        #gameContainer {
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        #gameContainer.show {
            opacity: 1;
        }

        /* ★ 横並びにするためのコンテナ */
        #container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 5px;
    flex-wrap: nowrap;   /* ★ これを追加する！ */
    margin-left: -10px;   /* ← これで全体を1cm左へ寄せる */
}

        #board {
            border: 1px solid #555;
            margin-top: 40px;
            margin-left: 120px;
    position: relative;  /* ★ これがないと絶対に動かない */
    left: 0px;
    top: 0px;
    transition: left 0.15s ease, top 0.15s ease;  /* ★ ここに入れる！ */
        }
#viewer {
    width: 600px;
    height: 700px;
    display: block;

    background: rgba(0,0,0,0.3);

    position: relative;   /* ★ これで三次元盤が動く */
    left: 0px;            /* ★ 初期位置 */
    top: 0px;             /* ★ 初期位置 */
}

        /* ★ 光沢ボタン（青） */

        .videoButton.blue {
            padding: 6px 12px;          /* 黄色と同じ */
            margin-right: 6px;          /* 黄色と同じ */
            background: linear-gradient(#4da3ff, #0066cc);
            border: 2px solid #004c99;
            border-radius: 4px;         /* 黄色と同じ */
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,120,255,0.6);
            transition: 0.2s;
            width: auto;                /* これが重要！ */
        }
        .videoButton.blue:hover {
            background: linear-gradient(#66b5ff, #0077ee);
        }        
        /* ★ 光沢ボタン（赤） */
        .videoButton.red {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: linear-gradient(#ff6666, #cc0000);
            border: 2px solid #990000;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,80,80,0.6);
            transition: 0.2s;
        }
        .videoButton.red:hover {
            background: linear-gradient(#ff8080, #dd0000);
            box-shadow: 0 0 12px rgba(255,120,120,0.9);
        }


        .videoButton.yellow:hover {
            background: linear-gradient(#fff8a5, #f0d000);
            box-shadow: 0 0 12px rgba(255,240,80,0.9);
        }

        /* 層ボタン（黄色に変更） */
        #layerButtons button {
            padding: 6px 12px;
            margin-right: 6px;
            border-radius: 4px;
            cursor: pointer;
        }
/* ★ 動画ボタンエリア（縦並び固定） */
#videoPanel {
    width: 200px;      /* ← 右側に縦並びで固定する幅 */
    margin-left: 20px; /* ← viewer と少し間隔を空ける */
}
        #layerButtons .videoButton.yellow {
    background: linear-gradient(#fff27a, #e6c300);
    border: 2px solid #b59a00;
    color: #333;
    font-weight: bold;
}
#layerButtons .videoButton.yellow:hover {
    background: linear-gradient(#fff8a5, #f0d000);
}


    </style>
</head>

<body>

    <!-- ★ ゲーム開始前の写真レイヤー（2秒だけ表示） -->
    <div id="photoIntro"></div>

    <!-- ★ タイトル画面レイヤー -->
    <div id="titleScreen">
        <div class="title-inner">
            <h1>多次元囲碁世界（仮称）</h1>
            <p>
                ・層ボタンで上下の世界を切り替えます。<br>
                ・盤をクリックして石を置きます。<br>
                ・モードボタンで対戦形式を選べます。
            </p>
            <button id="startButton">ゲーム開始</button>
        </div>
    </div>

    <!-- ★ ゲーム本体レイヤー -->
    <div id="gameContainer">

        <h1 style="text-align:center; margin-bottom:20px;">
            5D Go Viewer (Web Edition)
        </h1>



<!-- ★ 層ボタン + 青ボタンを横並びにするコンテナ -->
<div id="layerButtons" style="margin-bottom: 10px; display:flex; gap:6px;">

    <!-- 黄色ボタン -->
    <button class="videoButton yellow" onclick="setLayer(0)">1層目（最下部）</button>
    <button class="videoButton yellow" onclick="setLayer(1)">2層目</button>
    <button class="videoButton yellow" onclick="setLayer(2)">3層目</button>
    <button class="videoButton yellow" onclick="setLayer(3)">4層目</button>
    <button class="videoButton yellow" onclick="setLayer(4)">5層目（最上部）</button>


    <!-- 青ボタン（横一列） -->
    <button class="videoButton blue" id="demoButton">五次元取りデモ</button>
    <button class="videoButton blue" id="clearBoard">クリヤー</button>
    <button class="videoButton blue" id="modeHumanVsHuman">人間 vs 人間</button>
    <button class="videoButton blue" id="modeHumanVsAI">人間 vs AI</button>
    <button class="videoButton blue" id="modeAIVsAI">AI vs AI</button>
    <button class="videoButton blue" id="aiWeak">弱い（深さ1）</button>
    <button class="videoButton blue" id="aiNormal">普通（深さ2）</button>


</div>


        <!-- 横並びコンテナ -->
        <div id="container">
            <canvas id="board" width="300" height="300"></canvas>
            <canvas id="viewer"></canvas>

            <!-- ★ 動画ボタンエリア（赤） -->
            <div id="videoPanel">
                <h2>多次元囲碁動画</h2>

                <button class="videoButton red" onclick="playVideo('video2d.mp4')">２次元</button>
                <button class="videoButton red" onclick="playVideo('video3d.mp4')">３次元</button>
                <button class="videoButton red" onclick="playVideo('video4d.mp4')">４次元</button>
                <button class="videoButton red" onclick="playVideo('video5d.mp4')">５次元</button>
            </div>
        </div>

    </div> <!-- gameContainer 終わり -->

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- あなたのコード -->
    <script src="viewer.js"></script>
    <script src="board.js"></script>

    <!-- ★ タイトル画面 → ゲーム開始演出 -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
    // ★ 2秒だけ写真を見せる
    setTimeout(() => {
        document.getElementById("photoIntro").classList.add("hide");
    }, 2000);

    // ★ ここから先はあなたの元の処理
            const titleScreen = document.getElementById("titleScreen");
            const startButton = document.getElementById("startButton");
            const gameContainer = document.getElementById("gameContainer");

            startButton.addEventListener("click", () => {

                // 1. 幕アニメ開始
                titleScreen.classList.add("hide");

                // 2. 宇宙背景を表示
                setTimeout(() => {
                    document.body.style.backgroundImage = "url('space_nasa.jpg')";
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                    document.body.style.backgroundAttachment = "fixed";
                }, 1800);

                // 3. ゲーム画面フェードイン
                setTimeout(() => {
                    gameContainer.classList.add("show");
                }, 4000);
            });
        });

        window.addEventListener("load", () => {
            initViewer();
            window.viewerReady = true;
        });
window.addEventListener("load", () => {
    initViewer();
    window.viewerReady = true;

    // ★ ここで board を取得してから右クリックイベントを付ける
    const boardEl = document.getElementById("board");

    boardEl.addEventListener("contextmenu", (e) => {
        e.preventDefault();  // 右クリックメニューを無効化

        let left = parseInt(boardEl.style.left || 0);
        let top  = parseInt(boardEl.style.top  || 0);

        // ★ 移動量（あなたの好みで調整可能）
        left -= 30;   // 左へ 30px
        top  += 30;   // 下へ 30px

        // ★ 範囲制限（右側・上側・下側に出ないように）
        if (left < -50) left = -50;     // 左に行きすぎない
        if (top  > 150) top  = 150;     // 下に行きすぎない

        boardEl.style.left = left + "px";
        boardEl.style.top  = top  + "px";
    });
});


        /* ★ 動画再生（仮） */
        function playVideo(filename) {
            alert("動画 " + filename + " を再生します（後で実装）");
        }
    </script>

</body>
</html>
