<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>多次元囲碁世界（仮称）</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* ★ ゲーム開始前の写真レイヤー */
        #photoIntro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('PXL_sora.jpg');
            background-size: cover;
            background-position: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1.5s ease;
        }
        #photoIntro.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* ★ タイトル画面 */
        #titleScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('space_nasa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #titleScreen.hide {
            animation: rotateHide 1.5s ease forwards;
        }

        @keyframes rotateHide {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(90deg); opacity: 0; }
        }

        #titleScreen .title-inner {
            text-align: center;
            padding: 20px 40px;
            border: 1px solid #888;
            border-radius: 8px;
        }

        #startButton {
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ★ ゲーム画面フェードイン */
        #gameContainer {
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        #gameContainer.show {
            opacity: 1;
        }

        /* ★ 横並びコンテナ */
        #container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 5px;
            flex-wrap: nowrap;
            margin-left: -10px;
        }

        /* ★ 二次元盤 */
        #board {
            border: 1px solid #555;
            position: relative;
            left: 0px;
            top: 40px;
            transition: left 0.15s ease, top 0.15s ease;
        }

        /* ★ 三次元盤 */
        #viewer {
            width: 600px;
            height: 700px;
            display: block;
            background: rgba(0,0,0,0.3);
            position: relative;
            left: 0px;
            top: 0px;
        }

        /* ★ 青ボタン */
        .videoButton.blue {
            padding: 6px 12px;
            margin-right: 6px;
            background: linear-gradient(#4da3ff, #0066cc);
            border: 2px solid #004c99;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,120,255,0.6);
            transition: 0.2s;
            width: auto;
        }

        /* ★ 赤ボタン（動画用） */
        .videoButton.red {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: linear-gradient(#ff6666, #cc0000);
            border: 2px solid #990000;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,80,80,0.6);
            transition: 0.2s;
        }

        /* ★ 黄色ボタン */
        #layerButtons .videoButton.yellow {
            padding: 6px 12px;
            margin-right: 6px;
            border-radius: 4px;
            background: linear-gradient(#fff27a, #e6c300);
            border: 2px solid #b59a00;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }

        /* ★ 黄色＋赤枠（人間 vs 人間） */
        .videoButton.yellow.redBorder {
            border: 2px solid #ff3333;
            box-shadow: 0 0 8px rgba(255,80,80,0.6);
        }
/* ★ 人間 vs 人間専用オレンジボタン */
.videoButton.orange {
    padding: 6px 12px;
    margin-right: 6px;
    border-radius: 4px;
    background: linear-gradient(#ffb347, #ff7f00); /* オレンジのグラデーション */
    border: 2px solid #ff4500; /* 濃いオレンジ枠 */
    color: #333;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,120,0,0.6);
}
/* ★ 層ボタンの下に置く入力盤ラベル（グレー） */
.inputLabelSmall {
    color: #cccccc;        /* グレー文字 */
    font-size: 18px;
    font-weight: bold;
    margin-top: 6px;       /* ボタンとの距離 */
    margin-left: 4px;      /* 左端に寄せる */
}
/* ★ 動画ボタンエリア */
        #videoPanel {
            width: 200px;
            margin-left: 20px;
    margin-top: -95px;   /* ★ 2.5cm 上へ移動（マイナス方向） */
        }
/* ★ 最下部＋入力盤を縦に並べるコンテナ */
.layerGroup {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* ★ 入力盤ラベル（最下部の真下用） */
.inputLabelSmall {
    margin-left: 0;
    margin-top: 4px;
}
</style>
</head>

<body>

    <div id="photoIntro"></div>

    <div id="titleScreen">
        <div class="title-inner">
            <h1>多次元囲碁世界（仮称）</h1>
            <p>
                ・層ボタンで上下の世界を切り替えます。<br>
                ・盤をクリックして石を置きます。<br>
                ・モードボタンで対戦形式を選べます。
            </p>
            <button id="startButton">ゲーム開始</button>
        </div>
    </div>

    <div id="gameContainer">

        <h1 style="text-align:center; margin-bottom:20px;">
            5D Go Viewer (Web Edition)
        </h1>
<!-- ★ 層ボタン＋青ボタン -->
<div id="layerButtons" style="margin-bottom: 10px; display:flex; gap:6px;">

    <!-- ★ 人間 vs 人間（オレンジ） -->
    <button class="videoButton orange redBorder" id="modeHumanVsHuman">人間 vs 人間</button>

    <!-- 黄色ボタン（層） -->

<div class="layerGroup">
    <button class="videoButton yellow" onclick="setLayer(0)">最下部</button>
    <div class="inputLabelSmall">入力盤</div>
</div>
    <button class="videoButton yellow" onclick="setLayer(1)">2層目</button>
    <button class="videoButton yellow" onclick="setLayer(2)">3層目</button>
    <button class="videoButton yellow" onclick="setLayer(3)">4層目</button>
    <button class="videoButton yellow" onclick="setLayer(4)">5層目</button>

    <!-- 青ボタン -->
    <button class="videoButton blue" id="clearBoard">停止/クリア</button>
    <button class="videoButton blue" id="demoButton">三次元囲碁デモ</button>
    <button class="videoButton blue" id="modeHumanVsAI">人間 vs AI</button>
    <button class="videoButton blue" id="modeAIVsAI">AI vs AI</button>
    <button class="videoButton blue" id="aiWeak">普通AI</button>
    <button class="videoButton blue" id="aiNormal">強いAI</button>
</div>



<!-- ★ container はこの下から始まる -->
<div id="container">

            <canvas id="board" width="300" height="300"></canvas>
            <canvas id="viewer"></canvas>

            <div id="videoPanel">
                <h2>多次元囲碁動画</h2>

                <button class="videoButton red" onclick="playVideo('video2d.mp4')">２次元</button>
                <button class="videoButton red" onclick="playVideo('3dgo0920_noPEzNN6.mp4')">３次元</button>
                <button class="videoButton red" onclick="playVideo('4dgo0921.mp4')">４次元</button>
                <button class="videoButton red" onclick="playVideo('5dgo0921.mp4')">５次元</button>
            <!-- ★ ここに追加 -->
                <button class="videoButton red" onclick="stopVideo()">動画停止</button>
                <video id="goVideo" width="300" controls style="margin-top:10px; display:none;"></video>
            </div>
        </div>

    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="viewer.js"></script>
    <script src="board.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {

            setTimeout(() => {
                document.getElementById("photoIntro").classList.add("hide");
            }, 2000);

            const titleScreen = document.getElementById("titleScreen");
            const startButton = document.getElementById("startButton");
            const gameContainer = document.getElementById("gameContainer");

            startButton.addEventListener("click", () => {
                titleScreen.classList.add("hide");

                setTimeout(() => {
                    document.body.style.backgroundImage = "url('space_nasa.jpg')";
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                    document.body.style.backgroundAttachment = "fixed";
                }, 1800);

                setTimeout(() => {
                    gameContainer.classList.add("show");
                }, 3000);
            });
        });

        window.addEventListener("load", () => {
            initViewer();
            window.viewerReady = true;

            const boardEl = document.getElementById("board");
            boardEl.addEventListener("contextmenu", (e) => {
                e.preventDefault();
                let left = parseInt(boardEl.style.left || 0);
                left -= 10;
                if (left < 50) left = 50;
                boardEl.style.left = left + "px";
            });
        });
function playVideo(filename) {
    const video = document.getElementById("goVideo");
    video.style.display = "block";   // ★ 動画を表示
    video.src = filename;            // ★ ファイルをセット
    video.play();                    // ★ 再生開始
}
function stopVideo() {
    const video = document.getElementById("goVideo");
    video.pause();              // ★ 再生停止
    video.currentTime = 0;      // ★ 頭に戻す
    video.style.display = "none";  // ★ 画面から消す
}
    </script>

</body>
</html>
