<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>多次元囲碁世界（仮称）</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* ★ ゲーム開始前の写真レイヤー */
        #photoIntro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('PXL_sora.jpg');
            background-size: cover;
            background-position: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1.5s ease;
        }
        #photoIntro.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* ★ タイトル画面 */

#titleScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('space_nasa.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    z-index: 9999;

    /* ★ 横並びを解除する */
    display: block;

    /* ★ 中央寄せはこれだけでOK */
    text-align: center;
}

/* ★ タイトル内の要素を縦に積み重ねる */
#titleScreen div {
    display: block;
}
#clearBoard {
    color: red;
    font-weight: bold;
}
#titleScreen.hide {
            animation: rotateHide 1.5s ease forwards;
        }

        @keyframes rotateHide {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(90deg); opacity: 0; }
        }

        #titleScreen .title-inner {
            text-align: center;
            padding: 20px 40px;
            border: 1px solid #888;
            border-radius: 8px;
        }

        #startButton {
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ★ ゲーム画面フェードイン */
        #gameContainer {
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        #gameContainer.show {
            opacity: 1;
        }

        /* ★ 横並びコンテナ */
        #container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 5px;
            flex-wrap: nowrap;
            margin-left: -10px;
        }

        /* ★ 二次元盤 */
        #board {
            border: 1px solid #555;
            position: relative;
            left: 0px;
            top: 40px;
            transition: left 0.15s ease, top 0.15s ease;
        }

        /* ★ 三次元盤 */
        #viewer {
            width: 600px;
            height: 700px;
            display: block;
            background: rgba(0,0,0,0.3);
            position: relative;
            left: 0px;
            top: 0px;
        }

        /* ★ 青ボタン */
        .videoButton.blue {
            padding: 6px 12px;
            margin-right: 6px;
            background: linear-gradient(#4da3ff, #0066cc);
            border: 2px solid #004c99;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,120,255,0.6);
            transition: 0.2s;
            width: auto;
        }

        /* ★ 赤ボタン（動画用） */
        .videoButton.red {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: linear-gradient(#ff6666, #cc0000);
            border: 2px solid #990000;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,80,80,0.6);
            transition: 0.2s;
        }

        /* ★ 黄色ボタン */
        #layerButtons .videoButton.yellow {
            padding: 6px 12px;
            margin-right: 6px;
            border-radius: 4px;
            background: linear-gradient(#fff27a, #e6c300);
            border: 2px solid #b59a00;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }

        /* ★ 黄色＋赤枠（人間 vs 人間） */
        .videoButton.yellow.redBorder {
            border: 2px solid #ff3333;
            box-shadow: 0 0 8px rgba(255,80,80,0.6);
        }
/* ★ 人間 vs 人間専用オレンジボタン */
.videoButton.orange {
    padding: 6px 12px;
    margin-right: 6px;
    border-radius: 4px;
    background: linear-gradient(#ffb347, #ff7f00); /* オレンジのグラデーション */
    border: 2px solid #ff4500; /* 濃いオレンジ枠 */
    color: #333;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,120,0,0.6);
}
/* ★ 層ボタンの下に置く入力盤ラベル（グレー） */
.inputLabelSmall {
    color: #cccccc;        /* グレー文字 */
    font-size: 18px;
    font-weight: bold;
    margin-top: 6px;       /* ボタンとの距離 */
    margin-left: 4px;      /* 左端に寄せる */
}
/* ★ 動画ボタンエリア */
        #videoPanel {
            width: 200px;
            margin-left: 20px;
    margin-top: -30px;   /* ★ 2.5cm 上へ移動（マイナス方向） */
        }
/* ★ 最下部＋入力盤を縦に並べるコンテナ */
.layerGroup {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* ★ 入力盤ラベル（最下部の真下用） */
.inputLabelSmall {
    margin-left: 0;
    margin-top: 4px;
}
</style>
</head>


<body>

<div id="photoIntro"></div>

<!-- ★ タイトル画面（ここがひとつのブロック） -->
<div id="titleScreen" style="text-align:center; margin-top:20px;">

    <!-- 赤い巨大飾り文字 -->
    <div style="font-size:80px; font-weight:bold; color:red;">
        越
    </div>

    <!-- メインタイトル -->
    <div style="font-size:32px; font-weight:bold; color:yellow; margin-top:10px;">
        時空を越えて多次元囲碁世界へようこそ
    </div>

    <!-- 説明文 -->
    <div style="font-size:20px; color:white; margin-top:10px;">
        三次元囲碁ゲームを楽しんで、多次元囲碁を満喫してね
    </div>

    <!-- ゲーム開始ボタン -->
    <div style="margin-top:20px;">

<button id="startButton" class="videoButton blue">ゲーム開始</button>
    </div>

</div>  <!-- ★ titleScreen の終わり（ここが重要） -->


<!-- ★ ゲーム本体コンテナ（タイトルの外側） -->
<div id="gameContainer">

    <h1 style="text-align:center; margin-bottom:20px;">
        5D Go Viewer (Web Edition)
    </h1>
    <!-- ここから先はあなたの既存のゲームUIが続く -->
    <!-- ★ 層ボタン＋青ボタン -->
<div id="layerButtons" style="margin-bottom: 10px; display:flex; gap:6px;">

    <!-- ★ 人間 vs 人間（オレンジ） -->
    <button class="videoButton orange redBorder" id="modeHumanVsHuman">人間 vs 人間</button>

    <!-- 黄色ボタン（層） -->

<div class="layerGroup">
    <button class="videoButton yellow" onclick="setLayer(0)">最下部</button>
    <div class="inputLabelSmall">入力盤</div>
</div>
    <button class="videoButton yellow" onclick="setLayer(1)">2層目</button>
    <button class="videoButton yellow" onclick="setLayer(2)">3層目</button>
    <button class="videoButton yellow" onclick="setLayer(3)">4層目</button>
    <button class="videoButton yellow" onclick="setLayer(4)">5層目</button>

    <!-- 青ボタン -->
    <button class="videoButton orange" id="modeHumanVsAI">人間 vs AI</button>
    <button class="videoButton blue" id="demoButton">三次元囲碁デモ</button>
    <button class="videoButton blue" id="modeAIVsAI">AI vs AI</button>
    <button class="videoButton blue" id="aiWeak">AI普通</button>
    <button class="videoButton blue" id="aiNormal">AI強い</button>
    <button class="videoButton blue" id="clearBoard">停止/クリア</button>
<!-- ★ 引き分け表示（ここに追加する） -->
<span id="drawMessage" style="color:red; font-weight:bold; margin-left:10px;"></span>
</div>



<!-- ★ container はこの下から始まる -->
<div id="container">

            <canvas id="board" width="300" height="300"></canvas>
            <canvas id="viewer"></canvas>

            <div id="videoPanel">
                <h2>多次元囲碁動画</h2>

                <button class="videoButton red" onclick="playVideo('2dgo0922.mp4')">２次元</button>
                <button class="videoButton red" onclick="playVideo('3dgo0920_noPEzNN6.mp4')">３次元</button>
                <button class="videoButton red" onclick="playVideo('4dgo0921.mp4')">４次元</button>
                <button class="videoButton red" onclick="playVideo('5dgo0921.mp4')">５次元</button>
            <!-- ★ ここに追加 -->
                <button class="videoButton red" onclick="stopVideo()">動画停止</button>
                <video id="goVideo" width="300" controls style="margin-top:10px; display:none;"></video>
            </div>
        </div>

    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="board.js"></script>
    <script src="viewer.js"></script>
<script>
window.addEventListener("DOMContentLoaded", () => {

    // ★ 写真レイヤーをフェードアウト
    setTimeout(() => {
        document.getElementById("photoIntro").classList.add("hide");
    }, 2000);

    const titleScreen   = document.getElementById("titleScreen");
    const startButton   = document.getElementById("startButton");
    const gameContainer = document.getElementById("gameContainer");

    startButton.addEventListener("click", () => {

        // ★ タイトル画面を回転フェードアウト
        titleScreen.classList.add("hide");

        // ★ 背景切り替え（1.8秒後）
        setTimeout(() => {
            document.body.style.backgroundImage = "url('space_nasa.jpg')";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundAttachment = "fixed";
        }, 1800);

        // ★ ゲーム画面フェードイン（3秒後）
        setTimeout(() => {
            gameContainer.classList.add("show");
        }, 3000);

        // ★★★ Three.js のウェルカム演出はフェードイン後に開始
        setTimeout(() => {
            initViewer();          // ← viewer.js の演出が確実に見える
            window.viewerReady = true;
        }, 3000);
    });
});


// ★ board.js の初期化は load 時でOK（viewer 初期化とは分離）
window.addEventListener("load", () => {

    const boardEl = document.getElementById("board");

    boardEl.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        let left = parseInt(boardEl.style.left || 0);
        left -= 10;
        if (left < 50) left = 50;
        boardEl.style.left = left + "px";
    });
});


// ★ 動画再生ロジック（そのまま残す）
function playVideo(filename) {
    const video = document.getElementById("goVideo");
    video.style.display = "block";
    video.src = filename;
    video.play();
}

function stopVideo() {
    const video = document.getElementById("goVideo");
    video.pause();
    video.currentTime = 0;
    video.style.display = "none";
}
</script>


</body>

</html>
