<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>多次元囲碁世界（仮称）</title>

    <style>

/* ★ 背景などのスタイル */
body {
    background-image: url('PXL_sora.jpg');
    background-size: cover;
    background-position: center;
    color: white;
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    /* overflow-x: hidden; ← これを消す */

}

/* ★ ゲーム開始前の写真レイヤー */
#photoIntro {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('PXL_sora.jpg');
    background-size: cover;
    background-position: center;
    z-index: 10000;
}

/* ★ タイトル画面 */
#titleScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('space_nasa.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    z-index: 9999;
    text-align: center;
    display: none;
}

#titleScreen.hide {
    animation: rotateHide 1.5s ease forwards;
}

@keyframes rotateHide {
    0% { transform: rotateY(0deg); opacity: 1; }
    100% { transform: rotateY(90deg); opacity: 0; }
}

/* ★ ゲーム画面フェードイン */
#gameContainer {
    opacity: 0;
    transition: opacity 1.5s ease;
}
#gameContainer.show {
    opacity: 1;
}

/* ★ ボタン類（青） */
.videoButton.blue {
    padding: 6px 12px;
    margin-right: 6px;
    background: linear-gradient(#4da3ff, #0066cc);
    border: 2px solid #004c99;
    border-radius: 4px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(0,120,255,0.6);
    transition: 0.2s;
}

/* ★ ボタン類（赤） */
.videoButton.red {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: linear-gradient(#ff6666, #cc0000);
    border: 2px solid #990000;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,80,80,0.6);
    transition: 0.2s;
}

/* ★ ボタン類（オレンジ） */
.videoButton.orange {
    padding: 6px 12px;
    margin-right: 6px;
    border-radius: 4px;
    background: linear-gradient(#ffb347, #ff7f00);
    border: 2px solid #ff4500;
    color: #333;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,120,0,0.6);
}

/* ★ ボタン類（黄色） */
.videoButton.yellow {
    padding: 6px 12px;
    margin-right: 6px;
    border-radius: 4px;
    background: linear-gradient(#fff27a, #e6c300);
    border: 2px solid #b59a00;
    color: #333;
    font-weight: bold;
    cursor: pointer;
}
#clearBoard {
    color: red;
    font-weight: bold;
}
.returnButton {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 9999;
}
/* ★ 入力盤ラベル */
.inputLabelSmall {
    color: #cccccc;
    font-size: 18px;
    font-weight: bold;
    margin-top: 6px;
    margin-left: 4px;
}


/* ★ 層ボタン＋青ボタンのコンテナ */
#layerButtons {

    margin-bottom: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;   /* ← マニュアルボタンが必ず表示される */
    width: 100%;   /* ← これを必ず入れる */
}


/* ★ 層ボタンの縦並び */
.layerGroup {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* ★ 横並びコンテナ（盤＋動画） */
#container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 5px;
    flex-wrap: nowrap;
    margin-left: -10px;
}

/* ★ 二次元盤 */
#board {
    border: 1px solid #555;
    position: relative;
    left: 0px;
    top: 40px;
    transition: left 0.15s ease, top 0.15s ease;
}

/* ★ 三次元盤 */
#viewer {
    width: 500px;
    height: 700px;
    display: block;
    background: rgba(0,0,0,0.3);
    position: relative;
    left: 0px;
    top: 0px;
}

/* ★ 動画ボタンエリア */
#videoPanel {
    width: 200px;
    margin-left: 20px;
    margin-top: -30px;
}
    </style>
</head>

<body>

<div id="photoIntro"></div>

<!-- ★ タイトル画面 -->
<div id="titleScreen" style="margin-top:20px;">

    <div style="font-size:80px; font-weight:bold; color:red;">越</div>

    <div style="font-size:32px; font-weight:bold; color:yellow; margin-top:10px;">
        時空を越えて多次元囲碁世界へようこそ
    </div>

    <div style="font-size:20px; color:white; margin-top:10px;">
        三次元囲碁ゲームを楽しんで、多次元囲碁を満喫してね
    </div>

    <div style="margin-top:20px;">

<button id="startButton" class="videoButton blue">ゲーム開始</button>

    </div>

    <div style="margin-top:10px;">
        <button class="videoButton blue" onclick="location.href='manual.html'">マニュアル</button>
    </div>
    <!-- ★ 終了ボタン（ここに追加） -->
    <div style="margin-top:10px;">
        <button class="videoButton blue" onclick="closeApp()">
            終了
        </button>
    </div>
</div> <!-- ★ titleScreen を閉じる -->

<!-- ★ ゲーム本体 -->
<div id="gameContainer">

    <h1 style="text-align:center; margin-bottom:20px;">5D Go Viewer (Web Edition)</h1>
    <!-- ★ 白文字（flexの外） -->

<div style="color:white; font-size:22px; font-weight:bold; margin-top:-30px; margin-left:10px;">
    三次元囲碁ゲーム　
    <span id="whiteCaptured" style="color:red; font-size:22px; margin-left:20px;">
        取った白石：0
    </span>
</div>

<div id="layerButtons">
    <!-- ★ 戻るボタン（左上固定） -->
    <button class="videoButton blue returnButton"
            id="aiNormal"
            onclick="location.href='index.html'"
            style="color:red;">
        戻る
    </button>



    <button class="videoButton orange redBorder" id="modeHumanVsHuman">人間 vs 人間</button>

    <div class="layerGroup">
        <button class="videoButton yellow" onclick="setLayer(0)">最下部</button>
        <div class="inputLabelSmall">入力盤</div>
    </div>

    <button class="videoButton yellow" onclick="setLayer(1)">2層目</button>
    <button class="videoButton yellow" onclick="setLayer(2)">3層目</button>
    <button class="videoButton yellow" onclick="setLayer(3)">4層目</button>
    <button class="videoButton yellow" onclick="setLayer(4)">5層目</button>

    <button class="videoButton orange" id="modeHumanVsAI">人間 vs AI</button>
    <button class="videoButton blue" id="demoButton">三次元囲碁デモ</button>
    <button class="videoButton blue" id="modeAIVsAI">AI vs AI</button>

    <button class="videoButton blue" id="aiWeak">AI強い</button>



    <button class="videoButton blue" id="clearBoard">停止/クリア</button>

    <span id="drawMessage" style="color:red; font-weight:bold; margin-left:10px;"></span>

    <button class="videoButton blue" onclick="location.href='manual.html'">マニュアル</button>

</div> <!-- ★★★ layerButtons をここで閉じる ★★★ -->
<div id="container">

    <canvas id="board" width="300" height="300"></canvas>
    <canvas id="viewer"></canvas>

    <div id="videoPanel">
        <h2>多次元囲碁動画</h2>

        <button class="videoButton red" onclick="playVideo('2dgo0922.mp4')">２次元(pc×pc)</button>
        <button class="videoButton red" onclick="playVideo('3dgo0920_noPEzNN6.mp4')">３次元(AI対戦)</button>
        <button class="videoButton red" onclick="playVideo('4dgo0921.mp4')">４次元(AI対戦)</button>
        <button class="videoButton red" onclick="playVideo('5dgo0921.mp4')">５次元(AI対戦)</button>
        <button class="videoButton red" onclick="stopVideo()">動画停止</button>
      

        <video id="goVideo" width="300" controls style="margin-top:10px; display:none;"></video>
    </div>

</div>

</div> <!-- gameContainer を閉じる -->
<!-- ★ Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="board.js"></script>
<script src="viewer.js"></script>

<script>

// ★ 白石カウンター（最初に必ず置く）
let whiteCapturedCount = 0;

function updateWhiteCapturedDisplay() {
    const el = document.getElementById("whiteCaptured");
    if (el) {
        el.textContent = "取った白石：" + whiteCapturedCount;
    }
}

// ★ 停止／クリアボタンのイベント登録（最重要）
function registerClearBoard() {
    const clearBoard = document.getElementById("clearBoard");
    if (clearBoard) {
        clearBoard.onclick = () => {

            // ★ 動画停止
            stopVideo();

            // ★ 盤面初期化
            initViewer();

            // ★ 白石カウンターを必ずリセット
            whiteCapturedCount = 0;
            updateWhiteCapturedDisplay();
        };
    }
}

window.addEventListener("DOMContentLoaded", () => {

    // ★ manual.html から戻ってきたらタイトル画面をスキップ
    const params = new URLSearchParams(window.location.search);
    if (params.get("from") === "manual") {

        document.body.style.backgroundImage = "url('space_nasa.jpg')";
        document.getElementById("titleScreen").style.display = "none";
        document.getElementById("gameContainer").classList.add("show");

        initViewer();
        window.viewerReady = true;

        registerClearBoard();   // ← ここで必ず有効化

        return;
    }

    const intro = document.getElementById("photoIntro");
    const titleScreen = document.getElementById("titleScreen");
    const startButton = document.getElementById("startButton");
    const gameContainer = document.getElementById("gameContainer");

    intro.style.display = "block";
    setTimeout(() => {
        intro.style.display = "none";
        titleScreen.style.display = "block";
    }, 2000);

    startButton.addEventListener("click", () => {
        intro.style.display = "none";
        titleScreen.classList.add("hide");

        setTimeout(() => {
            document.body.style.backgroundImage = "url('space_nasa.jpg')";
        }, 3000);

        setTimeout(() => {
            gameContainer.classList.add("show");
        }, 3000);

        setTimeout(() => {
            initViewer();
            window.viewerReady = true;

            registerClearBoard();   // ← ゲーム開始後にも必ず有効化
        }, 3000);
    });
});

window.addEventListener("load", () => {
    const boardEl = document.getElementById("board");

    boardEl.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        let left = parseInt(boardEl.style.left || 0);
        left -= 10;
        if (left < 50) left = 50;
        boardEl.style.left = left + "px";
    });
});

// ★ 動画再生
function playVideo(filename) {
    const video = document.getElementById("goVideo");
    video.style.display = "block";
    video.src = filename;
    video.play();

    registerClearBoard();   // ← 動画ボタンを押したあとにも再登録
}

// ★ 動画停止
function stopVideo() {
    const video = document.getElementById("goVideo");
    video.pause();
    video.currentTime = 0;
    video.style.display = "none";
}

// ★ アプリ終了
function closeApp() {
    window.open('', '_self');
    window.close();
}

</script>

</body>
</html>
